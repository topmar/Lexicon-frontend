<!DOCTYPE html>
<html lang="sv">

<head>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bucket List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Min Bucket List</h1>
  </header>
  <main>
    <form id="bucketForm">
      <input type="text" id="activityName" placeholder="Vad vill du göra?" required />
      <select id="activityCategory">
      </select>
      <button type="submit">Lägg till</button>
    </form>
    <section>
      <table id="bucket-lists">
        <thead>
          <tr>
            <th class="description">
              Att göra
              <button class="sort" onclick="sortBucketList('description', true)"><i class="fas fa-arrow-down"></i></button>
              <button class="sort" onclick="sortBucketList('description', false)"><i class="fas fa-arrow-up"></i></button>
            </th>
            <th class="category">
              Kategori
              <button class="sort" onclick="sortBucketList('category', true)"><i class="fas fa-arrow-down"></i></button>
              <button class="sort" onclick="sortBucketList('category', false)"><i class="fas fa-arrow-up"></i></button>
            </th>
          </tr>
        </thead>
        <tbody id="bucketTableBody">
        </tbody>
      </table>
    </section>
  </main>
  <dialog id="editModal">
    <form id="modalForm" method="dialog">
      <h2>Edit Item</h2>
      <input type="text" id="editDescription" placeholder="Vad vill du göra?" required />
      <select id="editCategory">
      </select>
      <button type="submit">Spara</button>
      <button type="button" onclick="closeModal()">Close</button>
    </form>
  </dialog>
  <script src="script.js"></script>
</body>

</html>
